<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FiveM Street Neon — Variant E preview</title>
<style>
@font-face { font-family: "Inter Variable"; src: url("fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
@font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-Regular-latin.woff2") format("woff2"); font-weight: 400; font-display: block; }
@font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-Medium-latin.woff2") format("woff2"); font-weight: 500; font-display: block; }

html { font-size: clamp(8px, calc(100vh / 108), 16px); }

:root {
  --fh-bg-base: #07070B;
  --fh-bg-surface: #111118;
  --fh-bg-elevated: #1B1B24;
  --fh-bg-overlay: rgba(4, 4, 8, 0.60);
  --fh-border: rgba(255, 255, 255, 0.12);
  --fh-text-primary: #F5F5F7;
  --fh-text-secondary: #B8B8C4;
  --fh-text-muted: #9A9AA8;
  --fh-text-on-accent: #0A0A0F;
  --fh-accent-primary: #FF4FA3;
  --fh-accent-secondary: #5CE1FF;
  --fh-success: #30D158;
  --fh-warning: #FFB340;
  --fh-danger: #FF5A52;
  --fh-info: #5CE1FF;
  --fh-job-police: #6492FF;
  --fh-job-ems: #FF6B6B;
  --fh-job-mechanic: #FF9F45;
  --fh-job-civil: #A1A1AA;
  --fh-hud-health: #3DDC84;
  --fh-hud-armor: #7C8CFF;
  --fh-hud-hunger: #FF9F45;
  --fh-hud-thirst: #4FB0FF;
  --fh-hud-stamina: #F5D64E;
  --fh-hud-stress: #B48CFF;
  --fh-hud-voice: #5CE1FF;
  --fh-hud-radio: #FF4FA3;
  --fh-hud-fuel: #FFC857;

  --fh-font-sans: "Inter Variable", "Inter", system-ui, "Segoe UI", sans-serif;
  --fh-font-display: "Inter Variable", "Inter", system-ui, "Segoe UI", sans-serif;
  --fh-font-mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
  --fh-text-2xs: 1.1rem;
  --fh-text-xs: 1.2rem;
  --fh-text-sm: 1.4rem;
  --fh-text-md: 1.6rem;
  --fh-text-lg: 2rem;
  --fh-text-xl: 2.4rem;
  --fh-text-2xl: 3.2rem;
  --fh-text-3xl: 4.4rem;
  --fh-text-4xl: 6.4rem;
  --fh-weight-regular: 400;
  --fh-weight-medium: 500;
  --fh-weight-semibold: 600;
  --fh-weight-bold: 700;

  --fh-space-0_5: 0.2rem;
  --fh-space-1: 0.4rem;
  --fh-space-2: 0.8rem;
  --fh-space-3: 1.2rem;
  --fh-space-4: 1.6rem;
  --fh-space-5: 2rem;
  --fh-space-6: 2.4rem;
  --fh-space-8: 3.2rem;
  --fh-space-10: 4rem;
  --fh-space-12: 4.8rem;
  --fh-space-16: 6.4rem;

  --fh-radius-xs: 0.6rem;
  --fh-radius-sm: 1rem;
  --fh-radius-md: 1.4rem;
  --fh-radius-lg: 2rem;
  --fh-radius-xl: 2.8rem;
  --fh-radius-pill: 99.9rem;
  --fh-border-width: max(1px, 0.1rem);
  --fh-border-width-strong: 0.2rem;

  --fh-shadow-1: 0 0.2rem 0.8rem rgba(0, 0, 0, 0.35);
  --fh-shadow-2: 0 0.8rem 2.4rem rgba(0, 0, 0, 0.45), 0 0.2rem 0.6rem rgba(0, 0, 0, 0.30);
  --fh-shadow-3: 0 2.4rem 6.4rem rgba(0, 0, 0, 0.55), 0 0.6rem 1.6rem rgba(0, 0, 0, 0.35);
  --fh-glow-accent: 0 0 0 0.1rem rgba(255, 79, 163, 0.55), 0 0 2.4rem rgba(255, 79, 163, 0.40);
  --fh-focus-ring: 0 0 0 0.2rem var(--fh-bg-base), 0 0 0 0.4rem var(--fh-accent-primary), 0 0 1.6rem rgba(255, 79, 163, 0.45);

  --fh-blur-thin: 1.2rem;
  --fh-blur-regular: 2.4rem;
  --fh-blur-thick: 4rem;
  --fh-material-thin: rgba(18, 18, 25, 0.70);
  --fh-material-regular: rgba(14, 14, 20, 0.82);
  --fh-material-thick: rgba(10, 10, 15, 0.90);

  --fh-duration-fast: 120ms;
  --fh-duration-enter: 200ms;
  --fh-duration-exit: 140ms;
  --fh-duration-slow: 420ms;
  --fh-ease-standard: cubic-bezier(0.23, 1, 0.32, 1);
  --fh-ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
}

/* ── Base ─────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
body {
  font-family: var(--fh-font-sans); color: var(--fh-text-primary); font-size: var(--fh-text-md);
  line-height: 1.45; font-feature-settings: "tnum" 1, "cv11" 1; -webkit-font-smoothing: antialiased;
  font-optical-sizing: auto;
}
button, input { font: inherit; color: inherit; }
p { margin: 0; }
.mono { font-family: var(--fh-font-mono); font-feature-settings: normal; }
.t-2xs { font-size: var(--fh-text-2xs); } .t-xs { font-size: var(--fh-text-xs); } .t-sm { font-size: var(--fh-text-sm); }
.t-md { font-size: var(--fh-text-md); } .t-lg { font-size: var(--fh-text-lg); line-height: 1.25; } .t-xl { font-size: var(--fh-text-xl); line-height: 1.2; }
.t-2xl { font-size: var(--fh-text-2xl); line-height: 1.1; letter-spacing: -0.02em; } .t-3xl { font-size: var(--fh-text-3xl); line-height: 1.05; letter-spacing: -0.02em; }
.t-4xl { font-size: var(--fh-text-4xl); line-height: 1; letter-spacing: -0.02em; }
.w4 { font-weight: 400; } .w5 { font-weight: 500; } .w6 { font-weight: 600; } .w65 { font-weight: 650; } .w7 { font-weight: 700; }
.sec { color: var(--fh-text-secondary); } .mut { color: var(--fh-text-muted); }
.caps { font-size: var(--fh-text-2xs); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--fh-text-muted); }
.row { display: flex; align-items: center; gap: var(--fh-space-3); }
.col { display: flex; flex-direction: column; gap: var(--fh-space-3); }
.grow { flex: 1; min-width: 0; } .between { justify-content: space-between; } .end { justify-content: flex-end; }
.abs { position: absolute; }
.nowrap { white-space: nowrap; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr { text-align: right; } .tc { text-align: center; }
.divider { height: var(--fh-border-width); background: var(--fh-border); border: 0; margin: 0; }

/* ── Icons ────────────────────────────────────────────────────────── */
.ico { width: 2rem; height: 2rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.s16 { width: 1.6rem; height: 1.6rem; } .ico.s24 { width: 2.4rem; height: 2.4rem; } .ico.s28 { width: 2.8rem; height: 2.8rem; }
.ico.s32 { width: 3.2rem; height: 3.2rem; } .ico.s48 { width: 4.8rem; height: 4.8rem; stroke-width: 1.5; }
.ico.fill { --if: currentColor; }

/* ── Boards & worlds ──────────────────────────────────────────────── */
.board { position: relative; width: 100vw; height: 100vh; overflow: hidden; isolation: isolate; }
.board.auto { height: auto; min-height: 100vh; }
.board-label {
  position: absolute; left: 50%; bottom: 0.8rem; transform: translateX(-50%); z-index: 90;
  font: 500 var(--fh-text-2xs)/1 var(--fh-font-mono); letter-spacing: 0.06em; text-transform: uppercase;
  color: rgba(255, 255, 255, 0.7); background: rgba(0, 0, 0, 0.55); padding: 0.5rem 1rem; border-radius: var(--fh-radius-pill); white-space: nowrap;
}
.world-day {
  background:
    radial-gradient(60rem 36rem at 88% 4%, #ffffff 0%, rgba(255, 255, 255, 0.92) 30%, rgba(255, 255, 255, 0) 72%),
    linear-gradient(180deg, #b9d4ee 0%, #dbe9f5 30%, #f4f1ea 50%, #e7e2d8 58%, #ddd8cd 100%);
}
.world-night {
  background:
    radial-gradient(40rem 24rem at 18% 48%, rgba(255, 140, 50, 0.32), transparent 70%),
    radial-gradient(30rem 20rem at 72% 40%, rgba(255, 60, 150, 0.22), transparent 70%),
    radial-gradient(36rem 22rem at 52% 62%, rgba(70, 200, 255, 0.14), transparent 70%),
    linear-gradient(180deg, #05060d 0%, #0b0e22 34%, #1a1430 52%, #0b0a12 60%, #121018 100%);
}
.city { position: absolute; left: 0; right: 0; top: 22%; height: 38%; z-index: -1; }
.city i { position: absolute; bottom: 0; display: block; }
.world-day .city i { background: linear-gradient(180deg, #c9d2da, #aeb8c1); }
.world-day .city i::after { content: ""; position: absolute; inset: 1rem 0.8rem 0; background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0 0.5rem, transparent 0.5rem 1.6rem), repeating-linear-gradient(90deg, transparent 0 0.6rem, rgba(150, 165, 178, 0.6) 0.6rem 0.9rem); }
.world-night .city i { background: linear-gradient(180deg, #151829, #0b0c16); }
.world-night .city i::after { content: ""; position: absolute; inset: 1rem 0.8rem 0; background: repeating-linear-gradient(180deg, rgba(255, 196, 120, 0.5) 0 0.4rem, transparent 0.4rem 1.6rem); -webkit-mask: repeating-linear-gradient(90deg, #000 0 0.6rem, transparent 0.6rem 1.4rem); mask: repeating-linear-gradient(90deg, #000 0 0.6rem, transparent 0.6rem 1.4rem); opacity: 0.7; }
.road { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; z-index: -1; }
.world-day .road {
  background:
    linear-gradient(100deg, transparent 0 46%, rgba(255, 255, 255, 0.9) 46% 47%, transparent 47% 100%),
    linear-gradient(80deg, transparent 0 53%, rgba(255, 255, 255, 0.9) 53% 54%, transparent 54% 100%),
    linear-gradient(180deg, #cfc9be 0%, #e9e5dd 60%, #f7f5f0 100%);
}
.world-night .road {
  background:
    repeating-linear-gradient(90deg, transparent 0 9rem, rgba(255, 150, 60, 0.06) 9rem 10rem, transparent 10rem 21rem),
    linear-gradient(180deg, #14121c 0%, #0e0d14 100%);
}
.scrim { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.35)), var(--fh-bg-overlay); }
.ped { position: absolute; width: 22rem; height: 62rem; bottom: 8rem; }
.ped::before { content: ""; position: absolute; left: -14rem; right: -14rem; bottom: -4rem; height: 12rem; background: radial-gradient(50% 50% at 50% 50%, rgba(255, 255, 255, 0.14), transparent 70%); }
.ped svg { width: 100%; height: 100%; fill: #262632; }

/* ── Materials ────────────────────────────────────────────────────── */
.m-thin { background: var(--fh-material-thin); } .m-reg { background: var(--fh-material-regular); } .m-thick { background: var(--fh-material-thick); }
.glass { border: var(--fh-border-width) solid var(--fh-border); box-shadow: inset 0 0.1rem 0 rgba(255, 255, 255, 0.08), var(--fh-shadow-2); }
.glass.sh1 { box-shadow: inset 0 0.1rem 0 rgba(255, 255, 255, 0.08), var(--fh-shadow-1); }
.glass.sh3 { box-shadow: inset 0 0.1rem 0 rgba(255, 255, 255, 0.08), var(--fh-shadow-3); }
.blur-thin { -webkit-backdrop-filter: blur(var(--fh-blur-thin)) saturate(160%); backdrop-filter: blur(var(--fh-blur-thin)) saturate(160%); }
.blur-reg { -webkit-backdrop-filter: blur(var(--fh-blur-regular)) saturate(160%); backdrop-filter: blur(var(--fh-blur-regular)) saturate(160%); }
.blur-thick { -webkit-backdrop-filter: blur(var(--fh-blur-thick)) saturate(160%); backdrop-filter: blur(var(--fh-blur-thick)) saturate(160%); }
.capsule { border-radius: var(--fh-radius-pill); }
.panel { border-radius: var(--fh-radius-xl); padding: var(--fh-space-8); background: var(--fh-material-thick); border: var(--fh-border-width) solid var(--fh-border); box-shadow: inset 0 0.1rem 0 rgba(255, 255, 255, 0.08), var(--fh-shadow-3); }
.card { border-radius: var(--fh-radius-lg); background: rgba(255, 255, 255, 0.06); padding: var(--fh-space-6); }
.well { border-radius: var(--fh-radius-lg); background: var(--fh-bg-surface); }
.panel-head { display: flex; align-items: flex-start; gap: var(--fh-space-4); margin-bottom: var(--fh-space-6); }
.panel-foot { display: flex; align-items: center; gap: var(--fh-space-3); margin-top: var(--fh-space-6); }
.tint { position: relative; isolation: isolate; }
.tint::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0.16; z-index: -1; }

/* ── Controls ─────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--fh-space-2); height: 4.4rem; padding: 0 var(--fh-space-5);
  border-radius: var(--fh-radius-pill); border: 0; background: rgba(255, 255, 255, 0.08); color: var(--fh-text-primary);
  font-size: var(--fh-text-md); font-weight: var(--fh-weight-semibold); white-space: nowrap; cursor: pointer;
  transition: background-color var(--fh-duration-fast) var(--fh-ease-standard), box-shadow var(--fh-duration-fast) var(--fh-ease-standard), transform var(--fh-duration-fast) var(--fh-ease-standard);
}
.btn:hover, .btn.is-hover { background: rgba(255, 255, 255, 0.14); }
.btn:focus-visible, .btn.is-focus { outline: none; box-shadow: var(--fh-focus-ring); }
.btn.is-pressed { background: rgba(255, 255, 255, 0.06); transform: scale(0.98); }
.btn-primary { background: var(--fh-accent-primary); color: var(--fh-text-on-accent); }
.btn-primary:hover, .btn-primary.is-hover { background: #FF6BB3; }
.btn-primary.is-pressed { background: #E8408F; }
.btn-primary.hero { box-shadow: var(--fh-glow-accent); }
.btn-ghost { background: transparent; color: var(--fh-text-secondary); }
.btn-danger { position: relative; isolation: isolate; background: transparent; color: var(--fh-danger); }
.btn-danger::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0.16; z-index: -1; }
.btn-danger-solid { background: var(--fh-danger); color: var(--fh-text-on-accent); }
.btn-success-solid { background: var(--fh-success); color: var(--fh-text-on-accent); }
.btn[disabled], .btn.is-disabled { opacity: 0.38; cursor: not-allowed; }
.btn-sm { height: 3.2rem; padding: 0 1.4rem; font-size: var(--fh-text-sm); }
.btn-lg { height: 5.6rem; padding: 0 var(--fh-space-8); font-size: var(--fh-text-lg); }
.btn-block { width: 100%; }
.icon-btn { width: 3.2rem; height: 3.2rem; padding: 0; border-radius: 50%; }
.icon-btn.lg { width: 4.4rem; height: 4.4rem; }
.spinner { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 0.2rem solid rgba(255, 255, 255, 0.18); border-top-color: var(--fh-accent-secondary); animation: spin 0.9s linear infinite; flex: none; }
.btn-primary .spinner { border-color: rgba(10, 10, 15, 0.25); border-top-color: var(--fh-text-on-accent); }
@keyframes spin { to { transform: rotate(360deg); } }

.kbd {
  display: inline-grid; place-items: center; min-width: 2.4rem; height: 2.4rem; padding: 0 0.6rem; border-radius: var(--fh-radius-xs);
  background: rgba(255, 255, 255, 0.14); border: var(--fh-border-width) solid var(--fh-border); box-shadow: 0 0.1rem 0 rgba(0, 0, 0, 0.4);
  font-size: var(--fh-text-xs); font-weight: 700; line-height: 1; color: var(--fh-text-primary); white-space: nowrap;
}
.kbd.lg { min-width: 2.8rem; height: 2.8rem; font-size: var(--fh-text-md); }
.kbd.accent { background: var(--fh-accent-primary); color: var(--fh-text-on-accent); border-color: transparent; }
.keys { display: flex; align-items: center; gap: var(--fh-space-4); color: var(--fh-text-secondary); font-size: var(--fh-text-sm); }
.keys span.k { display: inline-flex; align-items: center; gap: var(--fh-space-2); }

.field { display: flex; flex-direction: column; gap: var(--fh-space-1); }
.field > label { font-size: var(--fh-text-sm); color: var(--fh-text-secondary); font-weight: 500; }
.input {
  display: flex; align-items: center; gap: var(--fh-space-2); height: 4.4rem; padding: 0 var(--fh-space-4); border-radius: var(--fh-radius-sm);
  background: rgba(255, 255, 255, 0.06); border: var(--fh-border-width) solid var(--fh-border); color: var(--fh-text-primary); font-size: var(--fh-text-md);
}
.input .ph { color: var(--fh-text-muted); }
.input.is-focus { box-shadow: var(--fh-focus-ring); border-color: transparent; }
.input.is-error { border: var(--fh-border-width-strong) solid var(--fh-danger); }
.input.is-disabled { opacity: 0.38; }
.input .unit { margin-left: auto; color: var(--fh-text-secondary); }
.caret { width: 0.15rem; height: 2rem; background: var(--fh-accent-primary); margin-left: -0.6rem; }
.help { font-size: var(--fh-text-xs); color: var(--fh-text-muted); display: flex; gap: var(--fh-space-1); align-items: center; }
.help.err { color: var(--fh-danger); }

.seg { display: inline-flex; padding: 0.4rem; gap: 0.2rem; border-radius: var(--fh-radius-pill); background: rgba(255, 255, 255, 0.08); }
.seg > span { padding: 0 1.6rem; height: 3.2rem; display: inline-flex; align-items: center; gap: 0.6rem; border-radius: var(--fh-radius-pill); font-size: var(--fh-text-sm); font-weight: 600; color: var(--fh-text-secondary); white-space: nowrap; }
.seg > span.on { background: rgba(255, 255, 255, 0.18); color: var(--fh-text-primary); box-shadow: var(--fh-shadow-1); }
.seg > span.done { color: var(--fh-text-primary); }
.tabs { display: flex; gap: var(--fh-space-6); border-bottom: var(--fh-border-width) solid var(--fh-border); }
.tabs > span { position: relative; padding: 0 0 1.2rem; font-weight: 600; color: var(--fh-text-secondary); display: inline-flex; gap: 0.8rem; align-items: center; white-space: nowrap; }
.tabs > span.on { color: var(--fh-text-primary); }
.tabs > span.on::after { content: ""; position: absolute; left: 50%; bottom: -0.1rem; width: 2.4rem; height: 0.3rem; margin-left: -1.2rem; border-radius: 0.3rem; background: var(--fh-accent-primary); }
.count { font-size: var(--fh-text-xs); font-weight: 600; padding: 0.1rem 0.7rem; border-radius: var(--fh-radius-pill); background: rgba(255, 255, 255, 0.1); color: var(--fh-text-secondary); }

.slider { position: relative; height: 2.4rem; display: flex; align-items: center; }
.slider .trk { position: absolute; left: 0; right: 0; height: 0.6rem; border-radius: 0.6rem; background: rgba(255, 255, 255, 0.12); }
.slider .fil { position: absolute; left: 0; height: 0.6rem; border-radius: 0.6rem; background: var(--fh-text-secondary); }
.slider .th { position: absolute; width: 2.4rem; height: 2.4rem; margin-left: -1.2rem; border-radius: 50%; background: #fff; box-shadow: var(--fh-shadow-1); }
.slider.on .fil { background: var(--fh-accent-primary); }
.slider.on .th { box-shadow: var(--fh-focus-ring); }
.stepper { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem; border-radius: var(--fh-radius-pill); background: rgba(255, 255, 255, 0.08); }
.stepper b { min-width: 4rem; text-align: center; font-weight: 600; }
.stepper .icon-btn { width: 3.2rem; height: 3.2rem; }
.toggle { width: 5.2rem; height: 3.2rem; border-radius: var(--fh-radius-pill); background: rgba(255, 255, 255, 0.16); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 0.3rem; left: 0.3rem; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: #fff; box-shadow: var(--fh-shadow-1); }
.toggle.on { background: var(--fh-success); } .toggle.on::after { left: 2.3rem; }

.lrow { display: flex; align-items: center; gap: var(--fh-space-3); min-height: 5.6rem; padding: 0.8rem 1.2rem; border-radius: var(--fh-radius-md); }
.lrow.hover { background: rgba(255, 255, 255, 0.06); }
.lrow.sel { background: var(--fh-bg-elevated); box-shadow: inset 0 0 0 var(--fh-border-width-strong) var(--fh-accent-primary); }
.lrow.dis { opacity: 0.38; }
.lrow .t { font-weight: 600; } .lrow .s { font-size: var(--fh-text-sm); color: var(--fh-text-secondary); }
.tile { width: 3.6rem; height: 3.6rem; border-radius: var(--fh-radius-sm); display: grid; place-items: center; flex: none; background: rgba(255, 255, 255, 0.08); }
.tile.tint { background: transparent; }
.tile.round { border-radius: 50%; }
.badge { display: inline-flex; align-items: center; gap: 0.4rem; height: 2.4rem; padding: 0 1rem; border-radius: var(--fh-radius-pill); font-size: var(--fh-text-xs); font-weight: 600; white-space: nowrap; flex: none; }
.badge .ico { width: 1.4rem; height: 1.4rem; }
.badge.neutral { background: rgba(255, 255, 255, 0.1); color: var(--fh-text-secondary); }
.dot { width: 0.8rem; height: 0.8rem; border-radius: 50%; display: inline-block; flex: none; }
.bar { height: 0.6rem; border-radius: var(--fh-radius-pill); background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; }
.bar.lg { height: 0.8rem; }
.plate { font-family: var(--fh-font-mono); font-weight: 500; font-size: var(--fh-text-xs); padding: 0.2rem 0.8rem; border-radius: 0.6rem; background: rgba(255, 255, 255, 0.1); border: var(--fh-border-width) solid var(--fh-border); white-space: nowrap; }
.skel { background: rgba(255, 255, 255, 0.06); border-radius: var(--fh-radius-sm); position: relative; overflow: hidden; }
.skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent); animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }

.hud { position: absolute; display: flex; align-items: center; gap: var(--fh-space-2); background: var(--fh-material-regular); border-radius: var(--fh-radius-pill); box-shadow: inset 0 0.1rem 0 rgba(255, 255, 255, 0.08), var(--fh-shadow-1); border: var(--fh-border-width) solid var(--fh-border); }

  background:
    linear-gradient(32deg, transparent 0 47%, #6b6f7a 47% 49%, transparent 49%),
    linear-gradient(-58deg, transparent 0 60%, #6b6f7a 60% 61.5%, transparent 61.5%),

    #3a3d46; }

/* ── Radial ───────────────────────────────────────────────────────── */
