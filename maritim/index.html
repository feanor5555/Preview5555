<title>FiveM Harbour — Maritim · Design-System-Vorschau</title>
<style>

html { font-size: clamp(8px, calc(100vh / 108), 16px); }

:root {
  --fh-bg-base: #E7F1F5;

  --fh-job-civil: #5A6E80;
  --fh-hud-health: #D3334A;
  --fh-hud-armor: #2A68D4;
  --fh-hud-hunger: #C27812;
  --fh-hud-thirst: #138BBE;
  --fh-hud-stamina: #4F8E1A;
  --fh-hud-stress: #8655C9;
  --fh-hud-voice: #0F9775;
  --fh-hud-radio: #C43C86;
  --fh-hud-fuel: #C9600E;

  --fh-font-sans: "Barlow", system-ui, sans-serif;
  --fh-font-display: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  --fh-font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --fh-text-2xs: 1.2rem;
  --fh-text-xs: 1.3rem;

  --fh-border-width: max(1px, 0.1rem);

  --fh-shadow-1: 0 0.1rem 0.2rem rgba(11, 34, 54, 0.18), 0 0 0 max(1px, 0.1rem) rgba(11, 34, 54, 0.08);

  --fh-shadow-3: 0 0.4rem 1.2rem rgba(8, 28, 46, 0.20), 0 2.4rem 6.4rem rgba(8, 28, 46, 0.30);
  --fh-glow-accent: 0 0 0 0.3rem rgba(255, 194, 31, 0.55);
  --fh-focus-ring: 0 0 0 0.2rem var(--fh-bg-elevated), 0 0 0 0.4rem var(--fh-text-primary);
  --fh-blur-thin: 0px;
  --fh-blur-regular: 0px;
  --fh-blur-thick: 0px;
  --fh-material-thin: rgba(247, 250, 251, 0.86);
  --fh-material-regular: rgba(247, 250, 251, 0.94);
  --fh-material-thick: #F7FAFB;

  --fh-duration-fast: 120ms;
  --fh-duration-enter: 200ms;
  --fh-duration-exit: 140ms;
  --fh-duration-slow: 320ms;
  --fh-ease-standard: cubic-bezier(0.23, 1, 0.32, 1);
  --fh-ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
}

/* ---------- base ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--fh-text-primary); color: var(--fh-text-primary); font-family: var(--fh-font-sans); font-size: var(--fh-text-md); line-height: 1.45; -webkit-font-smoothing: antialiased; }
.num { font-family: var(--fh-font-display); font-variant-numeric: tabular-nums; font-weight: var(--fh-weight-bold); }
.mono { font-family: var(--fh-font-mono); font-weight: var(--fh-weight-medium); }
.sec { color: var(--fh-text-secondary); }
.mut { color: var(--fh-text-muted); }
.sm { font-size: var(--fh-text-sm); }
.xs { font-size: var(--fh-text-xs); }
.lg { font-size: var(--fh-text-lg); }
.semi { font-weight: var(--fh-weight-semibold); }
.r { text-align: right; }
.grow { flex: 1; min-width: 0; }
.hstack { display: flex; align-items: center; gap: var(--fh-space-2); }
.vstack { display: flex; flex-direction: column; gap: var(--fh-space-2); }
.between { display: flex; align-items: center; justify-content: space-between; gap: var(--fh-space-3); }
.abs { position: absolute; }

/* ---------- preview chrome (not part of the system) ---------- */
.frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; isolation: isolate; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
.scrim { position: absolute; inset: 0; background: var(--fh-bg-overlay); z-index: -1; }
.frame-label { position: absolute; top: 1.2rem; left: 50%; transform: translateX(-50%); z-index: 90; font: 500 var(--fh-text-xs)/1 var(--fh-font-mono); color: #fff; background: rgba(11, 34, 54, 0.88); padding: 0.7rem 1.4rem; border-radius: var(--fh-radius-pill); border: 1px dashed rgba(255, 255, 255, 0.55); white-space: nowrap; }
.ann { position: absolute; z-index: 80; font: 500 var(--fh-text-2xs)/1 var(--fh-font-mono); color: #fff; background: rgba(11, 34, 54, 0.88); padding: 0.5rem 0.9rem; border-radius: var(--fh-radius-sm); border: 1px dashed rgba(255, 255, 255, 0.55); white-space: nowrap; }
.ann.static { position: static; display: inline-block; align-self: flex-start; }

/* tint layer: token colour at low opacity under the content (no color-mix in Chromium 103) */
.tint, .row.sel, .nv.on, .ccard.sel, .tbl tr.sel td, .voice.off, .badge.st, .banner, .slot.target, .slot.bad { position: relative; isolation: isolate; }
.tint::after, .row.sel::after, .nv.on::after, .ccard.sel::after, .tbl tr.sel td::after, .voice.off::after, .badge.st::after, .banner::after, .slot.target::after, .slot.bad::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; background: var(--tc, var(--fh-accent-secondary)); opacity: var(--ta, 0.12); }

/* ---------- icons ---------- */
.ico { width: 1.6rem; height: 1.6rem; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.lg { width: 2rem; height: 2rem; }
.ico.xl { width: 2.4rem; height: 2.4rem; }
.ico.xxl { width: 3.2rem; height: 3.2rem; }

/* ---------- surfaces ---------- */
.chip { background: var(--fh-material-thick); border-radius: var(--fh-radius-md); box-shadow: var(--fh-shadow-1); }
.panel { background: var(--fh-bg-surface); border-radius: var(--fh-radius-lg); box-shadow: var(--fh-shadow-2); display: flex; flex-direction: column; overflow: hidden; }
.panel.glass { background: var(--fh-material-thick); }
.panel-head { display: flex; align-items: center; gap: var(--fh-space-3); padding: var(--fh-space-4) var(--fh-space-6); border-bottom: var(--fh-border-width) solid var(--fh-border); min-height: 6.4rem; }
.panel-title { font: var(--fh-weight-semibold) var(--fh-text-xl)/1.15 var(--fh-font-display); }
.panel-body { padding: var(--fh-space-6); }
.panel-foot { display: flex; align-items: center; justify-content: flex-end; gap: var(--fh-space-2); padding: var(--fh-space-4) var(--fh-space-6); border-top: var(--fh-border-width) solid var(--fh-border); margin-top: auto; }
.close { margin-left: auto; width: 3.2rem; height: 3.2rem; display: grid; place-items: center; border-radius: var(--fh-radius-md); color: var(--fh-text-secondary); }
.label { font: var(--fh-weight-semibold) var(--fh-text-2xs)/1.2 var(--fh-font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fh-text-secondary); }
.divider { height: var(--fh-border-width); background: var(--fh-border); }
.mark { display: inline-block; width: 4.8rem; height: 4.8rem; border-radius: var(--fh-radius-xs); background: linear-gradient(135deg, var(--fh-accent-primary) 50%, var(--fh-text-primary) 50%); flex: none; }
.mark.sm { width: 2.8rem; height: 2.8rem; }

/* ---------- buttons, keys ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--fh-space-2); height: 4rem; padding: 0 var(--fh-space-4); border-radius: var(--fh-radius-md); font: var(--fh-weight-semibold) var(--fh-text-md)/1 var(--fh-font-sans); border: var(--fh-border-width) solid transparent; white-space: nowrap; color: var(--fh-text-primary); background: transparent; }
.btn-p { background: var(--fh-accent-primary); color: var(--fh-text-on-accent); }
.btn-p.hover { filter: brightness(0.94); }
.btn-s { background: var(--fh-bg-elevated); border-color: var(--fh-border); }
.btn-t { background: var(--fh-accent-secondary); color: var(--fh-bg-elevated); }
.btn-d { background: var(--fh-danger); color: var(--fh-bg-elevated); }
.btn-dq { color: var(--fh-danger); }
.btn-sm { height: 3.2rem; padding: 0 var(--fh-space-3); font-size: var(--fh-text-sm); }
.btn-wide { width: 100%; }
.btn.dis { opacity: 0.45; }
.focus { box-shadow: var(--fh-focus-ring); }
.key { display: inline-grid; place-items: center; min-width: 2.4rem; height: 2.4rem; padding: 0 0.6rem; border-radius: var(--fh-radius-sm); background: var(--fh-text-primary); color: var(--fh-bg-elevated); font: var(--fh-weight-medium) var(--fh-text-xs)/1 var(--fh-font-mono); flex: none; }
.key.a { background: var(--fh-accent-primary); color: var(--fh-text-on-accent); }
.key.l { background: var(--fh-bg-elevated); color: var(--fh-text-primary); }
.key.off { background: var(--fh-border); color: var(--fh-text-secondary); }
.btn-p .key { background: var(--fh-text-primary); color: var(--fh-accent-primary); }
.spinner { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 0.2rem solid transparent; border-top-color: currentColor; border-right-color: currentColor; animation: spin 0.9s linear infinite; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.2rem 0.8rem; border-radius: var(--fh-radius-sm); font: var(--fh-weight-semibold) var(--fh-text-2xs)/1.5 var(--fh-font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fh-bg-elevated); background: var(--c); white-space: nowrap; }
.badge.job::before { content: ""; width: 0.6rem; height: 0.6rem; background: var(--fh-bg-elevated); }
.badge.st { color: var(--c); background: var(--fh-bg-elevated); --tc: var(--c); }
.badge.sk2 { background: var(--fh-accent-primary); color: var(--fh-text-on-accent); }
.c-police { --c: var(--fh-job-police); } .c-ems { --c: var(--fh-job-ems); } .c-mech { --c: var(--fh-job-mechanic); } .c-civil { --c: var(--fh-job-civil); }
.c-ok { --c: var(--fh-success); } .c-warn { --c: var(--fh-warning); } .c-err { --c: var(--fh-danger); } .c-info { --c: var(--fh-info); } .c-teal { --c: var(--fh-accent-secondary); } .c-navy { --c: var(--fh-text-primary); } .c-radio { --c: var(--fh-hud-radio); }
.dot { width: 0.8rem; height: 0.8rem; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }

/* ---------- form controls ---------- */
.field { display: grid; gap: var(--fh-space-1); }
.input { height: 4rem; display: flex; align-items: center; gap: var(--fh-space-2); padding: 0 var(--fh-space-3); background: var(--fh-bg-base); border: var(--fh-border-width) solid var(--fh-border); border-bottom: var(--fh-border-width-strong) solid var(--fh-text-muted); border-radius: var(--fh-radius-sm) var(--fh-radius-sm) 0 0; font-weight: var(--fh-weight-medium); white-space: nowrap; overflow: hidden; }
.input.area { height: 8rem; align-items: flex-start; padding-top: var(--fh-space-2); white-space: normal; }
.input.focus { border-bottom-color: var(--fh-text-primary); box-shadow: var(--fh-focus-ring); }
.input.err { border-bottom-color: var(--fh-danger); }
.input.ro { opacity: 0.6; }
.input .ph { color: var(--fh-text-muted); font-weight: var(--fh-weight-regular); }
.input .unit { margin-left: auto; color: var(--fh-text-muted); }
.caret { display: inline-block; width: 0.15rem; height: 2rem; background: var(--fh-text-primary); margin-left: -0.4rem; }
.ferr { display: flex; gap: var(--fh-space-1); align-items: center; color: var(--fh-danger); font-size: var(--fh-text-xs); font-weight: var(--fh-weight-medium); }
.seg { display: flex; background: var(--fh-bg-base); border-radius: var(--fh-radius-md); padding: 0.3rem; gap: 0.3rem; }
.seg > span { flex: 1; text-align: center; padding: 0.7rem 1rem; border-radius: var(--fh-radius-sm); color: var(--fh-text-secondary); font-weight: var(--fh-weight-semibold); font-size: var(--fh-text-sm); white-space: nowrap; }
.seg > .on { background: var(--fh-bg-elevated); color: var(--fh-text-primary); box-shadow: var(--fh-shadow-1); }
.stepper { display: flex; align-items: center; height: 4rem; background: var(--fh-bg-base); border-radius: var(--fh-radius-md); padding: 0 0.4rem; gap: var(--fh-space-1); }
.stepper .sb { width: 3.2rem; height: 3.2rem; display: grid; place-items: center; border-radius: var(--fh-radius-sm); }
.stepper .sv { flex: 1; text-align: center; font: var(--fh-weight-semibold) var(--fh-text-md)/1 var(--fh-font-display); font-variant-numeric: tabular-nums; }
.slider { position: relative; height: 0.4rem; background: var(--fh-border); border-radius: var(--fh-radius-pill); margin: 0.9rem 0.9rem 0.9rem 0; }
.slider > i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--v); background: var(--fh-text-primary); border-radius: inherit; }
.slider > i::after { content: ""; position: absolute; right: -0.9rem; top: 50%; width: 1.8rem; height: 1.8rem; margin-top: -0.9rem; border-radius: 50%; background: var(--fh-bg-elevated); box-shadow: var(--fh-shadow-1), inset 0 0 0 0.2rem var(--fh-text-primary); }
.toggle { width: 4.4rem; height: 2.4rem; border-radius: var(--fh-radius-pill); background: var(--fh-border); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 0.3rem; left: 0.3rem; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--fh-bg-elevated); box-shadow: var(--fh-shadow-1); }
.toggle.on { background: var(--fh-accent-secondary); }
.toggle.on::after { left: 2.3rem; }
.check { width: 2rem; height: 2rem; border-radius: var(--fh-radius-xs); border: var(--fh-border-width-strong) solid var(--fh-text-muted); display: grid; place-items: center; flex: none; }
.check.on { background: var(--fh-accent-secondary); border-color: var(--fh-accent-secondary); color: var(--fh-bg-elevated); }
.swatch { width: 3.2rem; height: 3.2rem; border-radius: var(--fh-radius-sm); background: var(--s); box-shadow: inset 0 0 0 var(--fh-border-width) rgba(11, 34, 54, 0.15); }
.swatch.on { box-shadow: var(--fh-focus-ring); }
.search { display: flex; align-items: center; gap: var(--fh-space-2); height: 4rem; padding: 0 var(--fh-space-3); background: var(--fh-bg-elevated); border: var(--fh-border-width) solid var(--fh-border); border-radius: var(--fh-radius-md); color: var(--fh-text-secondary); }
.select { justify-content: space-between; }

/* ---------- tabs, rows, tables ---------- */
.tabs { display: flex; gap: var(--fh-space-5); border-bottom: var(--fh-border-width) solid var(--fh-border); }
.tab { padding: var(--fh-space-3) 0 calc(var(--fh-space-3) - 0.3rem); font-weight: var(--fh-weight-semibold); color: var(--fh-text-secondary); border-bottom: 0.3rem solid transparent; white-space: nowrap; display: flex; align-items: center; gap: var(--fh-space-1); }
.tab.on { color: var(--fh-text-primary); border-color: var(--fh-accent-secondary); }
.chips { display: flex; gap: var(--fh-space-1); flex-wrap: wrap; }
.fchip { padding: 0.5rem 1.2rem; border-radius: var(--fh-radius-pill); border: var(--fh-border-width) solid var(--fh-border); font-size: var(--fh-text-sm); font-weight: var(--fh-weight-semibold); color: var(--fh-text-secondary); background: var(--fh-bg-elevated); }
.fchip.on { background: var(--fh-text-primary); border-color: var(--fh-text-primary); color: var(--fh-bg-elevated); }
.row { display: flex; align-items: center; gap: var(--fh-space-3); min-height: 4.4rem; padding: var(--fh-space-2) var(--fh-space-3); border-bottom: var(--fh-border-width) solid var(--fh-border); }
.row.sel { box-shadow: inset 0.3rem 0 0 var(--fh-accent-secondary); }
.row.hov { background: var(--fh-bg-base); }
.row.dis { opacity: 0.5; }
.row .t { font-weight: var(--fh-weight-semibold); }
.row .s { font-size: var(--fh-text-sm); color: var(--fh-text-secondary); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--fh-text-sm); }
.tbl th { font: var(--fh-weight-semibold) var(--fh-text-2xs)/1.2 var(--fh-font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fh-text-secondary); text-align: left; padding: 0.9rem 1.2rem; border-bottom: var(--fh-border-width) solid var(--fh-border); white-space: nowrap; }
.tbl td { padding: 0.9rem 1.2rem; border-bottom: var(--fh-border-width) solid var(--fh-border); vertical-align: middle; }
.tbl td.mono, .tbl td.num { white-space: nowrap; }
.tbl .r { text-align: right; }
.tbl td.num { font-weight: var(--fh-weight-semibold); }
.tbl tr.sel td:first-child { box-shadow: inset 0.3rem 0 0 var(--fh-accent-secondary); }
.tbl tr.me td { background: var(--fh-bg-base); }
.bar { height: 0.4rem; border-radius: var(--fh-radius-pill); background: var(--fh-border); overflow: hidden; }
.bar > i { display: block; height: 100%; width: var(--v); background: var(--c, var(--fh-text-primary)); border-radius: inherit; }

/* ---------- notifications, banners, states ---------- */
.toast { position: relative; display: grid; grid-template-columns: 0.6rem auto 1fr; column-gap: var(--fh-space-3); width: 40rem; background: var(--fh-material-thick); border-radius: var(--fh-radius-md); box-shadow: var(--fh-shadow-1); overflow: hidden; padding-right: var(--fh-space-4); }
.toast::before { content: ""; grid-row: 1 / 3; grid-column: 1; background: var(--c); }
.toast > .ico { grid-row: 1 / 3; grid-column: 2; color: var(--c); margin-top: 1.2rem; width: 2rem; height: 2rem; }
.toast .tt { grid-column: 3; padding-top: 1rem; font-weight: var(--fh-weight-semibold); display: flex; justify-content: space-between; gap: var(--fh-space-2); }
.toast .tt .meta { font-weight: var(--fh-weight-regular); font-size: var(--fh-text-xs); color: var(--fh-text-muted); }
.toast .tx { grid-column: 3; padding-bottom: 1.2rem; font-size: var(--fh-text-sm); color: var(--fh-text-secondary); }
.toast .timer { position: absolute; left: 0.6rem; bottom: 0; height: 0.2rem; width: var(--t); background: var(--c); }
.toast.more { display: block; width: 40rem; padding: 0.8rem 1.6rem; font-size: var(--fh-text-sm); font-weight: var(--fh-weight-semibold); color: var(--fh-text-secondary); text-align: center; }
.banner { --tc: var(--c, var(--fh-danger)); --ta: 0.08; display: grid; grid-template-columns: 0.6rem auto 1fr auto; column-gap: var(--fh-space-3); align-items: center; background: var(--fh-bg-elevated); border-radius: var(--fh-radius-md); overflow: hidden; padding-right: var(--fh-space-2); min-height: 5.6rem; }
.banner::before { content: ""; align-self: stretch; background: var(--c, var(--fh-danger)); }
.banner > .ico { color: var(--c, var(--fh-danger)); width: 2rem; height: 2rem; }
.banner .bt { font-weight: var(--fh-weight-semibold); font-size: var(--fh-text-md); }
.banner .bx { font-size: var(--fh-text-sm); color: var(--fh-text-secondary); }
.banner > div { padding: 0.8rem 0; }
.sk { background: var(--fh-bg-base); border-radius: var(--fh-radius-sm); animation: pulse 1.2s ease-in-out infinite alternate; }
.panel .sk, .chip .sk { background: var(--fh-border); animation-name: pulse-soft; }
.empty { display: grid; justify-items: center; text-align: center; gap: var(--fh-space-2); padding: var(--fh-space-10) var(--fh-space-6); }

/* ---------- HUD ---------- */
.vitals { display: flex; gap: var(--fh-space-2); padding: var(--fh-space-2) var(--fh-space-3) var(--fh-space-1); }

.vital .label { font-size: 1.1rem; letter-spacing: 0.04em; }
.dial { --v: 70; width: 4.8rem; height: 4.8rem; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--v) * 1%), var(--fh-border) 0); display: grid; place-items: center; position: relative; }
.dial::before { content: ""; position: absolute; inset: 0.4rem; border-radius: 50%; background: var(--fh-bg-elevated); }
.dial.zero::after { content: ""; position: absolute; inset: 0.4rem; border-radius: 50%; background: var(--fh-danger); opacity: 0.12; }
.dial .ico { position: relative; z-index: 1; color: var(--c); width: 2rem; height: 2rem; }

.c-health { --c: var(--fh-hud-health); } .c-armor { --c: var(--fh-hud-armor); } .c-hunger { --c: var(--fh-hud-hunger); } .c-thirst { --c: var(--fh-hud-thirst); } .c-stamina { --c: var(--fh-hud-stamina); } .c-stress { --c: var(--fh-hud-stress); } .c-voice { --c: var(--fh-hud-voice); } .c-fuel { --c: var(--fh-hud-fuel); }
.voice { display: inline-flex; align-items: stretch; overflow: hidden; align-self: flex-start; }
.voice .vm { display: flex; align-items: center; gap: var(--fh-space-2); padding: 0.8rem 1.2rem; }
.voice .vm .ico { width: 2rem; height: 2rem; color: var(--fh-text-secondary); }
.voice.speaking { box-shadow: var(--fh-shadow-1), 0 0 0 0.2rem var(--fh-hud-voice); }
.voice.speaking .vm .ico, .voice.speaking .pip.on { color: var(--fh-hud-voice); background-color: currentColor; }
.voice.speaking .vm .ico { background: none; }
.pips { display: flex; gap: 0.3rem; align-items: flex-end; }
.pip { width: 0.5rem; border-radius: 0.1rem; background: var(--fh-border); }
.pip:nth-child(1) { height: 0.8rem; } .pip:nth-child(2) { height: 1.2rem; } .pip:nth-child(3) { height: 1.6rem; }
.pip.on { background: var(--fh-text-primary); }
.voice .vr { display: flex; align-items: center; gap: var(--fh-space-1); padding: 0 1.2rem; border-left: var(--fh-border-width) solid var(--fh-border); font-size: var(--fh-text-sm); font-weight: var(--fh-weight-semibold); }
.voice .vr .ico { color: var(--fh-hud-radio); }
.voice.tx .vr { background: var(--fh-hud-radio); color: var(--fh-bg-elevated); border-left-color: transparent; }
.voice.tx .vr .ico { color: var(--fh-bg-elevated); }
.voice.tx .vm .ico { color: var(--fh-hud-radio); }
.voice.norx .vr { color: var(--fh-text-muted); }
.voice.norx .vr .ico { color: var(--fh-text-muted); }
.voice.off { background: var(--fh-bg-elevated); --tc: var(--fh-danger); }
.voice.off .vm, .voice.off .vm .ico { color: var(--fh-danger); }
.money { display: flex; flex-direction: column; align-items: flex-end; gap: var(--fh-space-2); }
.mchip { display: flex; align-items: center; gap: var(--fh-space-3); padding: 0.8rem 1.4rem; }
.mchip .ico { width: 2rem; height: 2rem; color: var(--fh-text-secondary); }
.mchip .num { font-size: var(--fh-text-lg); }
.delta { font: var(--fh-weight-bold) var(--fh-text-sm)/1 var(--fh-font-display); padding: 0.4rem 1rem; border-radius: var(--fh-radius-sm); background: var(--fh-material-thick); box-shadow: var(--fh-shadow-1); }
.compass { position: relative; display: flex; justify-content: space-between; align-items: center; height: 3.2rem; padding: 0 1.4rem; overflow: hidden; font: var(--fh-weight-semibold) var(--fh-text-xs)/1 var(--fh-font-display); color: var(--fh-text-secondary); }
.compass .hd { position: absolute; left: 50%; top: 0; transform: translateX(-50%); height: 100%; display: grid; place-items: center; padding: 0 0.8rem; background: var(--fh-text-primary); color: var(--fh-bg-elevated); font-size: var(--fh-text-sm); }
.mapframe { width: 30rem; height: 20rem; border-radius: var(--fh-radius-lg); padding: 0.4rem; background: var(--fh-material-thin); box-shadow: var(--fh-shadow-1); position: relative; }
.mapframe .map { width: 100%; height: 100%; border-radius: var(--fh-radius-md); overflow: hidden; position: relative; }
.mapframe .hb { position: absolute; left: 0.4rem; right: 0.4rem; height: 0.6rem; background: var(--fh-border); }
.mapframe .hb > i { display: block; height: 100%; width: var(--v); background: var(--c); }
.ammo { display: flex; align-items: baseline; gap: var(--fh-space-2); padding: 0.8rem 1.4rem; }
.ammo .mag { font-size: var(--fh-text-2xl); line-height: 1; }
.veh { display: flex; flex-direction: column; align-items: center; gap: var(--fh-space-2); }
.speedo { position: relative; width: 22rem; height: 22rem; }
.speedo > svg { width: 100%; height: 100%; display: block; }
.speedo .read { position: absolute; left: 0; right: 0; top: 7.4rem; text-align: center; }
.speedo .read .num { font-size: var(--fh-text-3xl); line-height: 1; display: block; }

.vstat { display: flex; gap: var(--fh-space-1); }
.vs { display: flex; align-items: center; gap: var(--fh-space-1); height: 4rem; padding: 0 1rem; color: var(--fh-text-muted); font-size: var(--fh-text-sm); font-weight: var(--fh-weight-semibold); }

.prog { width: 48rem; padding: 1rem 1.4rem 1.2rem; display: grid; gap: 0.8rem; }
.prog .track { height: 0.6rem; border-radius: var(--fh-radius-pill); background: var(--fh-border); overflow: hidden; }
.prog .track > i { display: block; height: 100%; width: var(--v); background: var(--c, var(--fh-text-primary)); }
.hint { display: inline-flex; align-items: center; gap: var(--fh-space-2); padding: 0.6rem 1.4rem 0.6rem 0.6rem; font-weight: var(--fh-weight-medium); white-space: nowrap; }
.hint .key { min-width: 3.2rem; height: 3.2rem; font-size: var(--fh-text-md); }
.hint.dim { color: var(--fh-text-muted); }
.hint.held .key { box-shadow: var(--fh-glow-accent); }
.holdring { position: relative; }
.holdring svg { position: absolute; inset: -0.5rem; width: calc(100% + 1rem); height: calc(100% + 1rem); }

/* chat */
.chat { width: 56rem; display: flex; flex-direction: column; }
.chat .lines { padding: var(--fh-space-2) var(--fh-space-3); display: grid; gap: 0.5rem; font-size: var(--fh-text-sm); }

.chat.idle { background: var(--fh-material-regular); }
.chatin { display: flex; align-items: center; gap: var(--fh-space-2); height: 4.4rem; padding: 0 var(--fh-space-2); border-top: var(--fh-border-width) solid var(--fh-border); background: var(--fh-bg-elevated); }
.sugg { margin-top: 0.4rem; background: var(--fh-bg-elevated); border-radius: var(--fh-radius-md); box-shadow: var(--fh-shadow-2); overflow: hidden; }

/* radial */
.radial { position: relative; width: 44rem; height: 44rem; }
.radial > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.radial .seglab { position: absolute; width: 10rem; margin-left: -5rem; margin-top: -2.8rem; display: grid; justify-items: center; gap: 0.4rem; font: var(--fh-weight-semibold) var(--fh-text-xs)/1.1 var(--fh-font-sans); text-align: center; }

.radial .hub { position: absolute; left: 50%; top: 50%; width: 14.4rem; height: 14.4rem; margin: -7.2rem 0 0 -7.2rem; border-radius: 50%; background: var(--fh-bg-elevated); box-shadow: var(--fh-shadow-2); display: grid; place-content: center; text-align: center; gap: 0.2rem; padding: 1.6rem; }

/* inventory */
.grid { display: grid; grid-template-columns: repeat(5, 9.6rem); gap: 0.8rem; }
.slot { position: relative; width: 9.6rem; height: 9.6rem; background: var(--fh-bg-elevated); border: var(--fh-border-width) solid var(--fh-border); border-radius: var(--fh-radius-sm); display: grid; place-items: center; }
.slot.empty { background: var(--fh-bg-base); border-style: dashed; }
.slot .n { position: absolute; left: 0.6rem; top: 0.4rem; font: var(--fh-weight-semibold) var(--fh-text-2xs)/1 var(--fh-font-mono); color: var(--fh-text-secondary); }
.slot .q { position: absolute; right: 0.6rem; bottom: 0.7rem; font: var(--fh-weight-bold) var(--fh-text-sm)/1 var(--fh-font-display); font-variant-numeric: tabular-nums; }
.slot .w { position: absolute; left: 0.6rem; bottom: 0.7rem; font-size: 1.1rem; color: var(--fh-text-muted); }
.slot .dur { position: absolute; left: 0; right: 0; bottom: 0; height: 0.3rem; background: var(--fh-border); }
.slot .dur > i { display: block; height: 100%; width: var(--v); background: var(--c); }
.slot .ico { width: 4rem; height: 4rem; stroke-width: 1.4; color: var(--fh-text-secondary); }
.slot.sel { border: var(--fh-border-width-strong) solid var(--fh-accent-secondary); }
.slot.target { border: var(--fh-border-width-strong) dashed var(--fh-accent-secondary); --ta: 0.08; }
.slot.bad { border: var(--fh-border-width-strong) dashed var(--fh-danger); --tc: var(--fh-danger); --ta: 0.08; }
.slot.ghost { opacity: 0.35; }
.slot.lift { box-shadow: var(--fh-shadow-2); transform: rotate(-3deg); }
.tooltip { background: var(--fh-bg-elevated); border-radius: var(--fh-radius-md); box-shadow: var(--fh-shadow-2); padding: var(--fh-space-3) var(--fh-space-4); width: 28rem; display: grid; gap: 0.4rem; }

/* phone */
.phone { width: 38rem; height: 76rem; border-radius: 4.4rem; background: var(--fh-text-primary); padding: 0.8rem; box-shadow: var(--fh-shadow-3); }
.phone .scr { width: 100%; height: 100%; border-radius: 3.6rem; background: var(--fh-bg-surface); overflow: hidden; position: relative; display: flex; flex-direction: column; }
.phone .sbar { display: flex; justify-content: space-between; align-items: center; padding: 1.4rem 2.6rem 0.6rem; font: var(--fh-weight-semibold) var(--fh-text-sm)/1 var(--fh-font-display); }
.phone .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem 0.8rem; padding: 2.4rem 1.6rem; }
.app { display: grid; justify-items: center; gap: 0.6rem; font-size: var(--fh-text-xs); font-weight: var(--fh-weight-medium); }
.app i { width: 6.4rem; height: 6.4rem; border-radius: var(--fh-radius-lg); display: grid; place-items: center; background: var(--c); color: var(--fh-bg-elevated); }
.app i .ico { width: 3rem; height: 3rem; }
.app.y i { background: var(--fh-accent-primary); color: var(--fh-text-on-accent); }
.dock { margin: auto 1.2rem 1.2rem; padding: 1.2rem; border-radius: 2.8rem; background: var(--fh-material-regular); display: grid; grid-template-columns: repeat(4, 1fr); justify-items: center; }
.bub { max-width: 80%; padding: 0.9rem 1.3rem; border-radius: 1.6rem; font-size: var(--fh-text-sm); line-height: 1.35; }
.bub.in { background: var(--fh-bg-elevated); box-shadow: var(--fh-shadow-1); align-self: flex-start; border-bottom-left-radius: 0.4rem; }
.bub.out { background: var(--fh-accent-secondary); color: var(--fh-bg-elevated); align-self: flex-end; border-bottom-right-radius: 0.4rem; }

/* plate, id */
.plate { align-self: flex-start; display: inline-flex; align-items: stretch; height: 3rem; border: var(--fh-border-width-strong) solid var(--fh-text-primary); border-radius: var(--fh-radius-sm); background: var(--fh-bg-elevated); overflow: hidden; font: var(--fh-weight-medium) var(--fh-text-md)/1 var(--fh-font-mono); white-space: nowrap; }
.plate::before { content: ""; width: 0.9rem; background: var(--fh-info); }
.plate span { display: flex; align-items: center; padding: 0 0.9rem; letter-spacing: 0.04em; }
.plate.lg { height: 4.4rem; font-size: var(--fh-text-xl); }
.plate.lg::before { width: 1.4rem; }
.idcard { width: 54rem; height: 34rem; border-radius: var(--fh-radius-xl); background: var(--fh-bg-elevated); box-shadow: var(--fh-shadow-2); overflow: hidden; display: flex; flex-direction: column; }
.idcard .ih { display: flex; align-items: center; gap: var(--fh-space-2); height: 4.4rem; padding: 0 var(--fh-space-4); background: var(--c, var(--fh-accent-secondary)); color: var(--fh-bg-elevated); }
.idcard .ib { flex: 1; display: grid; grid-template-columns: 14rem 1fr; gap: var(--fh-space-4); padding: var(--fh-space-4); }
.photo { width: 14rem; height: 18rem; border-radius: var(--fh-radius-sm); background: linear-gradient(180deg, var(--fh-bg-base), var(--fh-border)); overflow: hidden; position: relative; }
.idf { display: grid; gap: 0.1rem; }
.idf .label { font-size: 1.1rem; }
.idf b { font-weight: var(--fh-weight-semibold); font-size: var(--fh-text-md); line-height: 1.2; }

/* tablets */
.tablet { position: absolute; left: 50%; top: 50%; width: 156rem; height: 86rem; transform: translate(-50%, -50%); border-radius: 2.4rem; background: var(--fh-text-primary); padding: 1.2rem; box-shadow: var(--fh-shadow-3); }
.tablet .scr { width: 100%; height: 100%; border-radius: var(--fh-radius-xl); overflow: hidden; background: var(--fh-bg-base); display: grid; grid-template-rows: 6.4rem 1fr; grid-template-columns: 24rem 1fr; }
.tablet .th { grid-column: 1 / 3; display: flex; align-items: center; gap: var(--fh-space-3); padding: 0 var(--fh-space-6); background: var(--c); color: var(--fh-bg-elevated); }

.tablet .nav { background: var(--fh-bg-surface); border-right: var(--fh-border-width) solid var(--fh-border); padding: var(--fh-space-4) var(--fh-space-3); display: flex; flex-direction: column; gap: 0.2rem; }
.nv { display: flex; align-items: center; gap: var(--fh-space-3); height: 4.4rem; padding: 0 var(--fh-space-3); border-radius: var(--fh-radius-md); font-weight: var(--fh-weight-semibold); color: var(--fh-text-secondary); }
.nv.on { color: var(--fh-text-primary); box-shadow: inset 0.3rem 0 0 var(--fh-accent-secondary); }
.nv .cnt { margin-left: auto; font: var(--fh-weight-bold) var(--fh-text-xs)/1 var(--fh-font-display); padding: 0.3rem 0.7rem; border-radius: var(--fh-radius-pill); background: var(--fh-danger); color: var(--fh-bg-elevated); }
.tablet .main { padding: var(--fh-space-5); overflow: hidden; display: grid; gap: var(--fh-space-4); align-content: start; }
.card { background: var(--fh-bg-surface); border-radius: var(--fh-radius-lg); box-shadow: var(--fh-shadow-1); padding: var(--fh-space-4) var(--fh-space-5); }
.card-h { display: flex; align-items: center; gap: var(--fh-space-2); margin-bottom: var(--fh-space-3); }
.card-h h3 { font: var(--fh-weight-semibold) var(--fh-text-lg)/1.15 var(--fh-font-display); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0.6rem 1.6rem; font-size: var(--fh-text-sm); }
.kv dt { color: var(--fh-text-secondary); }
.kv dd { font-weight: var(--fh-weight-semibold); }
.dialog { background: var(--fh-bg-elevated); border-radius: var(--fh-radius-lg); box-shadow: var(--fh-shadow-3); display: flex; flex-direction: column; overflow: hidden; }
.dialog .dh { padding: var(--fh-space-6) var(--fh-space-6) 0; display: grid; gap: var(--fh-space-1); }
.dialog .db { padding: var(--fh-space-5) var(--fh-space-6); display: grid; gap: var(--fh-space-4); }
.dialog .df { display: flex; justify-content: flex-end; gap: var(--fh-space-2); padding: var(--fh-space-4) var(--fh-space-6); background: var(--fh-bg-surface); border-top: var(--fh-border-width) solid var(--fh-border); }
.dtitle { font: var(--fh-weight-semibold) var(--fh-text-xl)/1.15 var(--fh-font-display); }
.ctxmenu { width: 36rem; }
.ctxmenu .row { min-height: 5.2rem; }
.ctxmenu .row .ico.lead { width: 2rem; height: 2rem; color: var(--fh-text-secondary); }

/* death */
.deathbox { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); display: grid; justify-items: center; gap: var(--fh-space-4); color: var(--fh-bg-elevated); text-align: center; width: 90rem; }
.deathbox h1 { font: var(--fh-weight-bold) var(--fh-text-3xl)/1.05 var(--fh-font-display); letter-spacing: 0.01em; }
.deathbox p { font-size: var(--fh-text-lg); opacity: 0.92; }
.dchip { display: inline-flex; align-items: center; gap: var(--fh-space-2); padding: 0.9rem 1.6rem; border-radius: var(--fh-radius-md); background: var(--fh-bg-elevated); color: var(--fh-text-primary); font-weight: var(--fh-weight-semibold); }
.dchip .num { font-size: var(--fh-text-lg); }
.dact { display: inline-flex; align-items: center; gap: var(--fh-space-3); height: 5.2rem; padding: 0 2rem 0 0.8rem; border-radius: var(--fh-radius-md); background: var(--fh-bg-elevated); color: var(--fh-text-primary); font-weight: var(--fh-weight-semibold); font-size: var(--fh-text-md); }
.dact .key { height: 3.6rem; min-width: 3.6rem; font-size: var(--fh-text-md); }
.dact.done { padding-left: 1.6rem; }
.dact.hold { position: relative; overflow: hidden; box-shadow: var(--fh-glow-accent); }
.dact.hold::before { content: ""; position: absolute; inset: 0; width: var(--v); background: var(--fh-accent-primary); opacity: 0.5; }
.dact.hold > * { position: relative; }

/* loading screen */
.ls-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; background: linear-gradient(180deg, rgba(8, 28, 46, 0) 0%, rgba(8, 28, 46, 0.66) 70%); z-index: -1; }
.ls-brand { position: absolute; left: 6.4rem; bottom: 6.4rem; color: var(--fh-bg-elevated); display: grid; gap: var(--fh-space-3); }
.ls-brand h1 { font: var(--fh-weight-bold) var(--fh-text-4xl)/0.95 var(--fh-font-display); letter-spacing: 0.02em; text-transform: uppercase; }
.ls-prog { width: 56rem; display: grid; gap: var(--fh-space-2); margin-top: var(--fh-space-5); font-size: var(--fh-text-sm); font-weight: var(--fh-weight-medium); }
.ls-prog .track { height: 0.4rem; background: var(--fh-text-muted); border-radius: var(--fh-radius-pill); overflow: hidden; }
.ls-prog .track > i { display: block; height: 100%; width: var(--v); background: var(--fh-accent-primary); }
.ls-prog .track.indet > i { width: 30%; margin-left: 35%; }
.ls-tip { position: absolute; right: 6.4rem; bottom: 6.4rem; width: 40rem; padding: var(--fh-space-4) var(--fh-space-5); display: grid; gap: var(--fh-space-1); }
.dots { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
.dots i { width: 1.6rem; height: 0.3rem; border-radius: 0.2rem; background: var(--fh-border); }
.dots i.on { background: var(--fh-text-primary); }

/* charsel */
.ccard { display: grid; grid-template-columns: 1fr auto; gap: 0.4rem var(--fh-space-3); padding: var(--fh-space-3) var(--fh-space-4); min-height: 8.8rem; align-content: center; border-radius: var(--fh-radius-md); background: var(--fh-bg-elevated); box-shadow: var(--fh-shadow-1); }
.ccard.sel { box-shadow: var(--fh-shadow-1), inset 0.3rem 0 0 var(--fh-accent-secondary); }
.ccard > .badge { justify-self: end; align-self: center; }
.ccard > .sm, .ccard > .xs { grid-column: 1 / -1; }
.ccard.free { background: transparent; box-shadow: none; border: var(--fh-border-width-strong) dashed var(--fh-border); color: var(--fh-text-secondary); display: flex; align-items: center; gap: var(--fh-space-2); font-weight: var(--fh-weight-semibold); }
.ccard.locked { background: var(--fh-bg-base); box-shadow: none; color: var(--fh-text-muted); display: flex; align-items: center; gap: var(--fh-space-2); }
.ccard .nm { font: var(--fh-weight-semibold) var(--fh-text-lg)/1.15 var(--fh-font-display); }

/* chart (spawn) */
.chart { position: relative; border-radius: var(--fh-radius-lg); overflow: hidden; box-shadow: var(--fh-shadow-2); }
.pin { position: absolute; width: 3.2rem; height: 3.2rem; margin: -1.6rem 0 0 -1.6rem; border-radius: 50%; background: var(--fh-text-primary); color: var(--fh-bg-elevated); display: grid; place-items: center; box-shadow: 0 0 0 0.3rem var(--fh-bg-elevated), var(--fh-shadow-1); }
.pin.on { background: var(--fh-accent-primary); color: var(--fh-text-on-accent); width: 4rem; height: 4rem; margin: -2rem 0 0 -2rem; }
.pin.err { background: var(--fh-danger); }
.pin .ico { width: 1.6rem; height: 1.6rem; }
.pinlab { position: absolute; transform: translate(2.8rem, -50%); background: var(--fh-bg-elevated); padding: 0.4rem 1rem; border-radius: var(--fh-radius-sm); box-shadow: var(--fh-shadow-1); font-weight: var(--fh-weight-semibold); font-size: var(--fh-text-sm); white-space: nowrap; }

/* product / recipe cards */
.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--fh-space-3); }
.pcard { background: var(--fh-bg-elevated); border-radius: var(--fh-radius-md); box-shadow: var(--fh-shadow-1); padding: var(--fh-space-3); display: grid; gap: 0.4rem; }
.pcard .img { height: 10rem; border-radius: var(--fh-radius-sm); background: var(--fh-bg-base); display: grid; place-items: center; color: var(--fh-text-secondary); position: relative; }
.pcard .img .ico { width: 4.4rem; height: 4.4rem; stroke-width: 1.3; }
.pcard.out .img { opacity: 0.4; }
.pcard .price { font: var(--fh-weight-bold) var(--fh-text-lg)/1 var(--fh-font-display); font-variant-numeric: tabular-nums; }
.pcard .add { width: 3.2rem; height: 3.2rem; border-radius: var(--fh-radius-md); display: grid; place-items: center; background: var(--fh-bg-base); }
.gallery { position: absolute; inset: 7.2rem 3.2rem 3.2rem; display: grid; gap: var(--fh-space-4); }
.gcell { display: flex; flex-direction: column; gap: var(--fh-space-1); min-width: 0; min-height: 0; }
.gcell > .panel { flex: 1; }

@keyframes blink { 50% { opacity: 0.35; } }
@keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
@keyframes pulse-soft { from { opacity: 0.35; } to { opacity: 0.6; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .vital.low .ico, .vs.blink-ok .ico, .vs.crit .ico, .sk, .spinner { animation: none; }
}
</style>

<script>
/* ===== helpers ===== */
const I = (n, c = '') => `<svg class="ico ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const K = (k, c = '') => `<span class="key ${c}">${k}</span>`;
const B = (txt, c = 'c-civil', job = true) => `<span class="badge ${job ? 'job' : 'st'} ${c}">${txt}</span>`;
const frames = [];
let fno = 0;
function frame(label, scene, inner, opts = {}) {
  fno++;
  const n = String(fno).padStart(2, '0');
  frames.push(`<section class="frame" id="f${n}" data-label="${label}">${sceneSvg(scene)}${opts.scrim ? `<div class="scrim ${opts.scrim}"></div>` : ''}<div class="frame-label">${n} · ${label}</div>${inner}</section>`);
}
const polar = (cx, cy, r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
const arc = (cx, cy, r, a0, a1) => { const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1); const large = a1 - a0 > 180 ? 1 : 0; return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };

/* ===== stand-in game world ===== */
function sceneSvg(kind) {
  if (kind === 'none') return '';
  if (kind === 'split') return `<div style="position:absolute;inset:0;z-index:-2;display:grid;grid-template-columns:1fr 1fr">${['day', 'night'].map(k => `<div style="position:relative;overflow:hidden">${sceneSvg(k)}</div>`).join('')}</div>`;
  const D = kind === 'day';
  const c = D ? {
    sky0: '#6FBBE6', sky1: '#D6F0FA', sun: '#FFFFFF', shore: '#9DB8A6', sea0: '#3AA6CE', sea1: '#13668D', glint: '#FFFFFF', hull: '#F4F6F7', hullb: '#1E3550', house: '#B5543F', house2: '#E9E4DA', quay: '#D3CDC2', quay2: '#EFEBE3', crane: '#2F5E8E', crane2: '#E6EAED', lh: '#FFFFFF', lhb: '#C9343A', cont: ['#C0473A', '#2F6E9E', '#D9A52B', '#5E7C6B', '#F2F2F0', '#E07A2A', '#F5F5F3'], bollard: '#FFC21F', light: 'none'
  } : {

  };
  let s = `<svg class="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>

  return s + '</svg>';
}

/* ===== reusable HUD parts ===== */
const vit = (cls, icon, label, v, extra = '') => `<div class="vital ${cls} ${extra}"><div class="dial ${v === 0 ? 'zero' : ''}" style="--v:${v}">${I(icon)}</div><span class="label">${label}</span></div>`;
function vitals(o = {}) {
  const v = Object.assign({ health: 82, armor: 40, hunger: 64, thirst: 71, stamina: 55, stress: 18 }, o);
  return `<div class="chip vitals">${vit('c-health', 'heart', 'Leben', v.health, v.health <= 25 ? 'low' : '')}${vit('c-armor', 'shield', 'Panzer', v.armor, v.armor === 0 ? 'hide' : '')}${vit('c-hunger', 'hunger', 'Hunger', v.hunger, v.hunger <= 25 ? 'low' : '')}${vit('c-thirst', 'drop', 'Durst', v.thirst, v.thirst <= 25 ? 'low' : '')}${vit('c-stamina', 'zap', 'Ausdauer', v.stamina)}${vit('c-stress', 'activity', 'Stress', v.stress, v.stress >= 75 ? 'low' : '')}</div>`;
}
function voice(state = 'idle', range = 2, radio = true) {
  const pips = [1, 2, 3].map(i => `<i class="pip ${i <= range ? 'on' : ''}"></i>`).join('');
  const rl = ['', 'Flüstern', 'Normal', 'Rufen'][range];
  const rtxt = state === 'tx' ? 'Funk 101,5 · Sendet' : state === 'norx' ? 'Funk 101,5 · kein Empfang' : 'Funk 101,5';
  if (state === 'off') return `<div class="chip voice off"><div class="vm">${I('mic-off')}<span class="sm semi">Sprachchat getrennt</span></div></div>`;
  return `<div class="chip voice ${state}"><div class="vm">${I('mic')}<span class="sm semi">${rl}</span><span class="pips">${pips}</span></div>${radio ? `<div class="vr">${I(state === 'norx' ? 'mic-off' : 'radio')}<span>${rtxt}</span></div>` : ''}</div>`;
}
function minimap(h = 82, a = 40) {
  return `<div class="mapframe"><div class="map"><svg viewBox="0 0 300 200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="300" height="200" fill="#B9C6B4"/><path d="M0 120 Q 80 100 140 140 T 300 120 V200 H0Z" fill="#5E9DC0"/><path d="M180 0 V200 M0 60 H300 M60 0 L120 200 M230 0 L260 120" stroke="#F4F2EC" stroke-width="7"/><path d="M180 0 V200 M0 60 H300" stroke="#8C949A" stroke-width="1"/><rect x="200" y="70" width="22" height="16" fill="#A4ADA0"/><rect x="100" y="20" width="30" height="24" fill="#A4ADA0"/><path d="M150 100 L180 60 L240 60" stroke="#FFC21F" stroke-width="4" fill="none" stroke-dasharray="1 0"/><g transform="translate(150 100)"><path d="M0 -11 L8 9 L0 5 L-8 9Z" fill="#FFFFFF" stroke="#0B2236" stroke-width="2"/></g></svg></div>
  <div class="hb c-armor" style="bottom:1.2rem;--v:${a}%"><i></i></div><div class="hb c-health" style="bottom:0.4rem;--v:${h}%"><i></i></div></div>`;
}
const compass = (deg = 12) => { const d = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'], c = Math.round(deg / 45) % 8; const l = [-2, -1, 0, 1, 2].map(k => d[(c + k + 8) % 8]); return `<div class="chip compass" style="width:30rem"><span>${l[0]}</span><span>${l[1]}</span><span>${l[2]}</span><span>${l[3]}</span><span>${l[4]}</span><span class="hd">${d[c]} ${deg}°</span></div>`; };
const street = (s = 'Kaistraße', d = 'Fischmarkt') => `<div class="chip hstack" style="padding:0.7rem 1.2rem;width:30rem">${I('pin', 'lg')}<span class="semi">${s}</span><span class="sec sm">${d}</span></div>`;
function speedo(speed = 87, fuel = 62, gear = '3', unit = 'km/h') {
  const cx = 110, cy = 110; let t = '';
  const st = (k, v) => `style="${k}:var(--fh-${v})"`;
  for (let v = 0; v <= 240; v += 10) { const a = -135 + v / 240 * 270, maj = v % 20 === 0; const [x0, y0] = polar(cx, cy, maj ? 76 : 80, a), [x1, y1] = polar(cx, cy, 86, a); t += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" ${st('stroke', 'text-primary')} stroke-width="${maj ? 2 : 1}" opacity="${maj ? .9 : .5}"/>`; if (v % 40 === 0) { const [lx, ly] = polar(cx, cy, 64, a); t += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" font-family="Barlow Semi Condensed" font-weight="600" font-size="11" ${st('fill', 'text-secondary')}>${v}</text>`; } }
  const sa = -135 + Math.min(speed, 240) / 240 * 270;
  const [n0x, n0y] = polar(cx, cy, 70, sa), [n1x, n1y] = polar(cx, cy, 92, sa);
  const fa0 = 150, fa1 = 210, fv = fa0 + (fa1 - fa0) * fuel / 100;
  const fuelTone = fuel <= 5 ? 'danger' : fuel <= 15 ? 'warning' : 'hud-fuel';
  const [fx, fy] = polar(cx, cy, 101, 222);
  return `<div class="speedo"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="108" ${st('fill', 'material-thin')}/><circle cx="110" cy="110" r="94" ${st('fill', 'bg-elevated')}/>
  <path d="${arc(cx, cy, 101, fa0, fa1)}" ${st('stroke', 'border')} stroke-width="5" fill="none" stroke-linecap="round"/><path d="${arc(cx, cy, 101, fa0, fv)}" ${st('stroke', fuelTone)} stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="${arc(cx, cy, 89, -135, 135)}" ${st('stroke', 'bg-base')} stroke-width="5" fill="none"/><path d="${arc(cx, cy, 89, -135, sa)}" ${st('stroke', 'text-primary')} stroke-width="5" fill="none"/>${t}
  <line x1="${n0x}" y1="${n0y}" x2="${n1x}" y2="${n1y}" ${st('stroke', 'text-primary')} stroke-width="7" stroke-linecap="round"/><line x1="${n0x}" y1="${n0y}" x2="${n1x}" y2="${n1y}" ${st('stroke', 'accent-primary')} stroke-width="4" stroke-linecap="round"/></svg>
  <span style="position:absolute;left:${fx / 10 - 1}rem;top:${fy / 10 - 1}rem;color:var(--fh-${fuelTone})">${I('fuel')}</span>
  <div class="read"><span class="num">${speed}</span><span class="label">${unit}</span></div><span class="gear">${gear}</span></div>`;
}
function vstatus(o = {}) {
  const v = Object.assign({ left: 'off', right: 'off', belt: 'on', engine: 'on' }, o);
  const ind = (d, st) => `<div class="chip vs ${st === 'on' ? 'blink-ok' : ''}">${I(d === 'l' ? 'left' : 'right', 'lg')}</div>`;
  const belt = v.belt === 'on' ? `<div class="chip vs on">${I('belt', 'lg')}</div>` : v.belt === 'warn' ? `<div class="chip vs crit">${I('belt', 'lg')}<span>Gurt!</span></div>` : `<div class="chip vs">${I('belt', 'lg')}</div>`;

function radial(items, hov, hubT, hubS) {
  const n = items.length, R = 220, r0 = 82, r1 = 214, gap = 1.2; let p = '', labs = '';
  items.forEach((it, i) => {
    const a0 = i * 360 / n - 180 / n + gap, a1 = (i + 1) * 360 / n - 180 / n - gap;
    const [x0, y0] = polar(R, R, r1, a0), [x1, y1] = polar(R, R, r1, a1), [x2, y2] = polar(R, R, r0, a1), [x3, y3] = polar(R, R, r0, a0);
    const on = i === hov;
    p += `<path d="M${x0} ${y0} A${r1} ${r1} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r0} ${r0} 0 0 0 ${x3} ${y3}Z" style="fill:var(--fh-${on ? 'accent-primary' : 'material-thick'});stroke:var(--fh-border);stroke-width:1"/>`;
    const [lx, ly] = polar(R, R, (r0 + r1) / 2, (a0 + a1) / 2);
    labs += `<div class="seglab ${it[2] ? 'dis' : ''}" style="left:${lx / 44}rem;top:${ly / 44 * 1}rem;left:${lx / 10}rem;top:${ly / 10}rem">${I(it[0], 'xl')}<span>${it[1]}${it[3] ? ' ›' : ''}</span></div>`;
  });
  return `<div class="radial"><svg viewBox="0 0 440 440"><circle cx="220" cy="220" r="${r1 + 6}" style="fill:var(--fh-material-thin)"/>${p}</svg>${labs}<div class="hub"><span class="semi">${hubT}</span><span class="xs sec">${hubS}</span></div></div>`;
}
